# XcodeGen project spec — the source of truth for the Xcode project.
# Generate the .xcodeproj with:  xcodegen generate
# The generated TennisAce.xcodeproj is NOT committed (see .gitignore) so there
# are never .pbxproj merge conflicts between parallel branches.
name: TennisAce

options:
  bundleIdPrefix: investments.hoelzl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""        # set per developer / via CI (xcconfig or -allowProvisioningUpdates)
    CODE_SIGN_STYLE: Automatic

targets:
  TennisAce:
    type: application
    platform: iOS
    sources:
      - path: TennisAce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: investments.hoelzl.tennisace
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TennisAce
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - TennisAceTests
      gatherCoverageData: true

  TennisAceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TennisAceTests
    dependencies:
      - target: TennisAce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: investments.hoelzl.tennisace.tests
        GENERATE_INFOPLIST_FILE: YES
